name: Live checks

on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * 1"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e:live
      - name: Findings summary
        if: always()
        run: |
          if [ -f test-results/live-findings.json ]; then
            {
              echo "## Live findings"
              echo
              echo '```json'
              cat test-results/live-findings.json
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No findings were written." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
